name: Submit production sitemap

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      production_confirmed:
        description: The release is live and verified at https://www.navokit.com
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: production-sitemap
  cancel-in-progress: false

jobs:
  submit-sitemap:
    if: >-
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       (github.event.deployment.production_environment == true ||
        (github.event.deployment.environment == 'Production' &&
         github.event.deployment.transient_environment == false))) ||
      (github.event_name == 'workflow_dispatch' && inputs.production_confirmed == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Submit and verify the production sitemap
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: node scripts/submit-sitemap.mjs --submit
